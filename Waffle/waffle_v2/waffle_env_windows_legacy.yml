name: Waffle
channels:
  - conda-forge
  - defaults
variables:
  KMP_DUPLICATE_LIB_OK: "TRUE"
  OMP_NUM_THREADS: "1"
dependencies:
  - python=3.12
  - numpy
  - astropy
  - pillow
  - sunpy
  - python-dateutil
  - aiapy
  - drms
  - pandas
  - paramiko
  - scipy
  - pytz
  - matplotlib
  - scp
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cpu
      - torch
      - torchvision
      - torchaudio
